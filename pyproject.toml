[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "temporal-graph-4d"
dynamic = ["version"]
description = "Simulação didática de grafo espaço-tempo em R^4 (PyVista + Trame)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Anderson Costa Rodrigues" }]
keywords = ["graph", "temporal", "visualization", "pyvista", "trame", "networkx"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "pyvista>=0.43",
    "trame>=3.0",
    "trame-vuetify>=2.0",
    "trame-vtk>=2.0",
    "trame-pyvista>=0.1",
    "networkx>=3.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4", "astropy>=6.0"]  # astropy: só valida os planetas nos testes

[project.scripts]
temporal-graph = "temporal_graph.app:main"

[tool.setuptools.dynamic]
version = { attr = "temporal_graph.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/temporal_graph/celestial/catalog.py" = ["E501"]  # tabelas de dados
